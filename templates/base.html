<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        {% block title %}
        {% endblock %}
    </title>
    <style>
        p {
            text-align: center;
        }

        body {
            text-align: center;
        }

        form {
            border-radius: 12px;
        }

        input {
            text-align: center;
        }

        li {
            list-style: none;
        }

        #nav-bar {
            background-color: azure;
            padding: 12px;
            text-align: left;
        }
    </style>
</head>

<body>
    <div id="nav-bar">
        <a href="{% url 'todolist' %}">HOME</a>
        {% if user.is_authenticated %}
        Login: {{user.username}}&ensp;
        <a href="{% url 'logout' %}">Logout;</a>
        <a href="{% url 'createtodo' %}">Create</a>
        {% else %}
        <a href="{% url 'login' %}">Login</a>
        <a href="{% url 'resgister' %}">Register</a>
        {% endif %}
    </div>

    {% block content %}
    {% endblock %}
</body>

</html>
